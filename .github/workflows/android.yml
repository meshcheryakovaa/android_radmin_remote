name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Verify JavaScript
        run: |
          node --check app/src/main/assets/www/app.js
          node --check app/src/main/assets/www/classroom.js
      - name: Unit tests and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-build-cache --stacktrace
      - name: Native Xray smoke test (loopback only)
        run: python3 scripts/test-xray-native.py --download
      - name: Upload developer debug APK
        uses: actions/upload-artifact@v4
        with:
          name: developer-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Prepare private release signing
        id: signing
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          ANDROID_RELEASE_SIGNING_B64: ${{ secrets.ANDROID_RELEASE_SIGNING_B64 }}
        run: python3 scripts/prepare-release-signing.py
      - name: Build signed main APK
        if: steps.signing.outputs.ready == 'true'
        env:
          OPENRAD_SIGNING_PROPERTIES: ${{ steps.signing.outputs.propertiesFile }}
        run: |
          ./gradlew :app:assembleRelease --no-build-cache --stacktrace
          mkdir -p build/release-apks
          cp app/build/outputs/apk/release/app-release.apk build/release-apks/android-radmin-remote-0.4.2.apk
          signer_digest=$("$ANDROID_HOME/build-tools/34.0.0/apksigner" verify --print-certs build/release-apks/android-radmin-remote-0.4.2.apk | awk '/certificate SHA-256 digest:/ {print $NF; exit}')
          test "$signer_digest" = "$(cat release-signing-certificate.sha256)"
      - name: Upload signed main APK
        if: steps.signing.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: android-radmin-remote-0.4.2
          path: build/release-apks/android-radmin-remote-0.4.2.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Publish main release
        if: steps.signing.outputs.ready == 'true' && github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.4.2
          target_commitish: ${{ github.sha }}
          name: Android Radmin Remote 0.4.2
          prerelease: true
          files: build/release-apks/android-radmin-remote-0.4.2.apk
          fail_on_unmatched_files: true
          body: |
            Adaptive 16:9 thumbnail rows fill the full width for 5 or 30 PCs. Top toolbar sends shutdown, reboot, lock/unlock, websites and files to the displayed group, with per-PC send results and cancellation. Screens continue refreshing after lock.
            Preserves Direct / SOCKS5 / embedded VLESS Reality TCP and gRPC VPN.
            Android package: ru.meshcheryakov.androidradminremote. Android 8.0+.
            Uses the permanent release certificate; updates must keep this same key and package.
            Updates the main 0.3.0 / 0.4.0 / 0.4.1 with the same certificate. VPN identity/settings are retained on a normal update.
            Veyon authentication and framebuffer/input are verified on synthetic loopback peers and independent Qt wire fixtures. The user confirmed a real Veyon image on 0.4.0. Batch commands, file distribution and locked-screen capture require classroom acceptance. Veyon does not acknowledge application of feature commands; SENT reports transport sending only.
      - name: Remove temporary signing files
        if: always() && steps.signing.outputs.ready == 'true'
        env:
          SIGNING_PROPERTIES: ${{ steps.signing.outputs.propertiesFile }}
        run: |
          python3 - <<'PY_CLEAN'
          import os
          from pathlib import Path
          folder = Path(os.environ['SIGNING_PROPERTIES']).parent
          for name in ('release.jks', 'signing.properties'):
              (folder / name).unlink(missing_ok=True)
          folder.rmdir()
          PY_CLEAN
