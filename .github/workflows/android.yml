name: Android APK
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
        with:
          packages: platform-tools
          log-accepted-android-sdk-licenses: false
      - uses: gradle/actions/setup-gradle@v4
      - name: Install SDK 34
        run: sdkmanager 'platforms;android-34' 'build-tools;34.0.0'
      - name: Verify JavaScript
        run: node --check app/src/main/assets/www/app.js
      - name: Unit tests and debug APK
        run: ./gradlew :app:testDebugUnitTest :app:assembleDebug --no-build-cache --stacktrace
      - name: Native Xray smoke test (loopback only)
        run: python3 scripts/test-xray-native.py --download
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: android-radmin-remote-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-reports
          path: app/build/reports/tests/testDebugUnitTest/
          if-no-files-found: ignore
      - name: Publish downloadable debug APK
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v0.2.1-debug
          target_commitish: ${{ github.sha }}
          name: Android Radmin Remote 0.2.1 · debug
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
          fail_on_unmatched_files: true
          body: |
            Embedded libXray 26.10.10: import Xray/Happ JSON and select a VLESS Reality TCP or gRPC profile.
            Single APK: HTML UI, OpenRad engine, Direct / SOCKS5 / embedded Xray TCP relay.
            Adds gRPC profile import and cleans up the previous Xray session before retrying. AUTO is not enabled. Mobile allowlist connectivity requires manual validation.
            Install app-debug.apk on Android 8.0+. See README for configuration.
